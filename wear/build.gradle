// Wear OS companion for SimpleSwing: a one-tap "save swing" remote for the phone app.
// Must share the phone app's applicationId and signing key for Wear Data Layer messaging.
plugins {
  id 'com.android.application' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

android {
  namespace 'app.simpleswing.wear'
  compileSdk 36

  defaultConfig {
    applicationId 'app.simpleswing'
    minSdk 30
    targetSdk 36
    // Wear builds live in the 1,000,000+ range so they never collide with phone versionCodes in Play.
    versionCode 1000001
    versionName '0.1.0'
  }

  signingConfigs {
    // Play upload key, configured outside the repo (see plugins/with-release-signing.js).
    release {
      if (project.hasProperty('SIMPLESWING_UPLOAD_STORE_FILE')) {
        storeFile file(SIMPLESWING_UPLOAD_STORE_FILE)
        storePassword SIMPLESWING_UPLOAD_STORE_PASSWORD
        keyAlias SIMPLESWING_UPLOAD_KEY_ALIAS
        keyPassword SIMPLESWING_UPLOAD_KEY_PASSWORD
      }
    }
    // Same debug keystore as the generated phone project (android/app/debug.keystore).
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled false
      // Must match the phone app's signing for Wear Data Layer messaging (same rule as the phone).
      def playUpload = project.hasProperty('SIMPLESWING_UPLOAD_STORE_FILE') &&
        gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
      signingConfig playUpload ? signingConfigs.release : signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.compose.ui:ui:1.9.3'
  implementation 'androidx.wear.compose:compose-material:1.4.0'
  implementation 'androidx.wear.compose:compose-foundation:1.4.0'
  implementation 'androidx.wear:wear:1.3.0'
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
