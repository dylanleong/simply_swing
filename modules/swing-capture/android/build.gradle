plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.simpleswing.capture'
version = '0.1.0'

android {
  namespace "app.simpleswing.capture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
  testImplementation 'junit:junit:4.13.2'
  // Real org.json for protocol tests (android.jar only has stubs on the JVM).
  testImplementation 'org.json:json:20240303'
}
